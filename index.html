<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Ecofiltros</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>Registro de Entrega de Ecofiltros</h1>
            <p>Escanee los códigos de barras para registrar la entrega.</p>
        </header>

        <section class="card">

            <h2>Información General</h2>

            <div class="form-grid">

                <div>
                    <label>Cliente</label>

                    <select id="cliente">
                        <option value="">Seleccione</option>
                        <option>Fundación Génesis</option>
                        <option>Municipalidad</option>
                        <option>Proyecto Escolar</option>
                    </select>
                </div>

                <div>
                    <label>Proyecto</label>

                    <select id="proyecto">
                        <option value="">Seleccione</option>
                        <option>Entrega Comunitaria</option>
                        <option>Escuelas</option>
                        <option>Donación</option>
                    </select>
                </div>

            </div>

        </section>

        <section class="card">

            <h2>Escáner</h2>

            <div id="reader"></div>

            <div class="ultima-lectura">

                <h3>Último código leído</h3>

                <span id="codigoActual">
                    Sin registros
                </span>

            </div>

        </section>

        <section class="card">

            <div class="table-header">

                <h2>Ecofiltros Registrados</h2>

                <span id="totalRegistros">
                    Total: 0
                </span>

            </div>

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Código</th>
                        <th>Fecha</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaRegistros"></tbody>

            </table>

        </section>

        <section class="card">

            <button id="btnExportar">
                Preparar Entrega
            </button>

        </section>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
