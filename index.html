<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Entrega de Ecofiltros</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>HOJA DE ENTREGA</h1>
        <p>Control de Ecofiltros</p>
    </header>

    <section class="card">

        <h2>Datos Generales</h2>

        <div class="form-grid">

            <div>
                <label>Destino</label>

                <select id="destino">
                    <option>Sucursal</option>
                    <option selected>Cliente</option>
                </select>
            </div>

            <div>
                <label>Cliente</label>

                <input
                    type="text"
                    id="cliente"
                    placeholder="Nombre del cliente">
            </div>

            <div>
                <label>Fecha</label>

                <input
                    type="date"
                    id="fechaEntrega"
                    readonly>
            </div>

        </div>

    </section>

    <section class="card">

        <h2>Escáner</h2>

        <button id="btnEscanear">
            Escanear Filtro
        </button>

        <div id="reader"></div>

        <div id="mensaje"></div>

        <div class="ultima-lectura">
            <h3>Último Código</h3>

            <span id="codigoActual">
                Sin lectura
            </span>
        </div>

        <div class="registro-form">

            <label>Token</label>

            <input
                type="text"
                id="token"
                placeholder="Ingrese token">

            <label>Observación</label>

            <input
                type="text"
                id="observacion"
                placeholder="Ingrese observación">

            <button id="guardarFiltro">
                Guardar Filtro
            </button>

        </div>

    </section>

    <section class="card">

        <div class="table-header">

            <h2>Filtros Registrados</h2>

            <span id="totalRegistros">
                Total: 0
            </span>

        </div>

        <table>

            <thead>

            <tr>
                <th>#</th>
                <th>Código</th>
                <th>Token</th>
                <th>Observación</th>
                <th>Fecha</th>
                <th></th>
            </tr>

            </thead>

            <tbody id="tablaRegistros"></tbody>

        </table>

    </section>

    <section class="card acciones">

        <button id="btnGenerarPDF">
            Generar PDF
        </button>

        <button id="btnNuevaEntrega">
            Nueva Entrega
        </button>

    </section>

</div>

<script src="js/app.js"></script>

</body>
</html>
