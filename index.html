<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Entrega de Ecofiltros</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>HOJA DE ENTREGA DE ECOFILTROS</h1>
        <p>Registro mediante código de barras</p>
    </header>

    <section class="card">

        <h2>Datos Generales</h2>

        <div class="form-grid">

            <div>
                <label for="destino">Destino</label>

                <select id="destino">
                    <option>Sucursal</option>
                    <option selected>Cliente</option>
                </select>
            </div>

            <div>
                <label for="cliente">Cliente</label>

                <input
                    type="text"
                    id="cliente"
                    placeholder="Nombre del cliente">
            </div>

            <div>
                <label for="fechaEntrega">Fecha</label>

                <input
                    type="date"
                    id="fechaEntrega"
                    readonly>
            </div>

        </div>

    </section>

    <section class="card">

        <h2>Escáner</h2>

        <button id="btnEscanear" type="button">
            Escanear Filtro
        </button>

        <div id="reader"></div>

        <div id="mensaje"></div>

        <div class="ultima-lectura">
            <h3>Último código leído</h3>
            <span id="codigoActual">Sin lectura</span>
        </div>

        <div class="registro-form">

            <label for="token">Token</label>
            <input
                type="text"
                id="token">

            <label for="observacion">Observación</label>
            <input
                type="text"
                id="observacion">

            <button id="guardarFiltro" type="button">
                Guardar Filtro
            </button>

        </div>

    </section>

    <section class="card">

        <div class="table-header">

            <h2>Filtros Registrados</h2>

            <span id="totalRegistros">
                Total: 0
            </span>

        </div>

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Código</th>
                    <th>Token</th>
                    <th>Observación</th>
                    <th>Fecha</th>
                    <th>Acción</th>
                </tr>

            </thead>

            <tbody id="tablaRegistros"></tbody>

        </table>

    </section>

    <section class="card acciones">

        <button id="btnGenerarPDF" type="button">
            Generar PDF
        </button>

        <button id="btnNuevaEntrega" type="button">
            Nueva Entrega
        </button>

    </section>

</div>

<script src="js/app.js"></script>

</body>
</html>
